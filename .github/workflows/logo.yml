name: Sonda CSI
on:
  push:
    branches: [sonda-foto]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          get() { curl -sSL -A "$UA" "${@:3}" -o "out/$1" "$2" -w "$1 %{http_code} %{content_type} %{size_download}\n" >> out/elenco.txt || echo "$1 errore" >> out/elenco.txt; }
          get csi_girone_b.html "https://live.centrosportivoitaliano.it/26/Calcio-a-11/Emilia-Romagna/Reggio-Emilia/C36124/?j=NEU9REhGJjRGPVBOWSY0Rz1HSkVGSCY0SD1GTEdLS0kmNEk9VHY0MTByIE8mNEw9REhGJjQyPWU="
      - run: |
          git config user.name biasola-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out && git commit -qm "Sonda foto" && git push origin HEAD:sonda-foto
