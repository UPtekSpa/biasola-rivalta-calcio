name: Sonda Juniores
on:
  push:
    branches: [sonda-foto]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get() { curl -sSL -A "$UA" -o "out/$1" -w "$1 %{http_code}\n" "$2" | tee -a out/log.txt || true; }
          get cr_squadra.html "https://www.calcioreggiano.com/squadre/squadra.aspx?idsquadra=1075"
          get tc_jun_scheda.html "https://www.tuttocampo.it/EmiliaRomagna/JunioresProvincialiU19/GironeAProvincialiReggioEmilia/Squadra/Biasola/1199973/Scheda"
          get tc_jun_classifica.html "https://www.tuttocampo.it/EmiliaRomagna/JunioresProvincialiU19/GironeAProvincialiReggioEmilia/Classifica"
          grep -oiE 'href="[^"]*(squadra|campionato|classifica|giornata|calendario)[^"]*"' out/cr_squadra.html | sort -u | head -80 > out/cr_links.txt || true
      - run: |
          cd out
          git init -q -b sonda-out
          git config user.name biasola-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm sonda
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sonda-out
