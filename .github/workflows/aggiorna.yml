name: Aggiorna news e pubblica il sito

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 ora italiana (legale)
    - cron: "0 17 * * *"  # 19:00
    - cron: "0 21 * * 0"  # domenica 23:00, dopo le partite
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Salva l'HTML scaricato nel branch 'sonde' (per adattare i parser)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "config.json", "scraper/**", ".github/workflows/aggiorna.yml"]

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Raccogli news, risultati e classifiche
        run: python scraper/collect.py ${{ inputs.snapshot && '--snapshot sonde' || '' }}

      - name: Salva i dati raccolti
        run: |
          git config user.name "biasola-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico news $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Pubblica le pagine scaricate nel branch sonde
        if: ${{ inputs.snapshot }}
        run: |
          cd sonde
          git init -q -b sonde
          git config user.name "biasola-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Pagine scaricate $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sonde

      - name: Pubblica il sito su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: biasola-bot
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
