<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<meta name="robots" content="noindex,nofollow">
<title>Test VIDAA</title>
<style>
  html, body { margin:0; padding:0; background:#111; color:#fff; font-family: Arial, sans-serif; }
  body { padding:30px 50px; font-size:30px; line-height:1.4; }
  h1 { font-size:40px; margin:0 0 20px 0; }
  .row { margin:6px 0; word-wrap:break-word; }
  .ok { color:#5fdc6b; }
  .ko { color:#ff6b6b; }
  .info { color:#9ecbff; }
  .wait { color:#ffd166; }
  #vwrap { margin-top:20px; }
  video { width:640px; height:360px; background:#000; }
  .hint { color:#aaa; font-size:24px; margin-top:20px; }
</style>
</head>
<body>

<h1>Test VIDAA - API e video</h1>
<div id="log"></div>

<div id="vwrap">
  <video id="v" controls muted autoplay></video>
</div>
<div class="hint">Premi OK/Invio per rilanciare i test</div>

<script>
// ============ CONFIGURAZIONE ============
// I dati NON sono scritti nel file: si passano nell'indirizzo dopo il #
// (la parte dopo # non viene inviata al server, quindi non finisce nei log).
// Esempio:
//   test.html#s=http://server:8080&u=utente&p=password&v=http://server:8080/live/utente/password/12345.m3u8
// Parametri:  s = server Xtream (senza / finale)   u = utente   p = password
//             v = URL stream di prova (opzionale)  x = URL del proxy ASP (opzionale)
function leggiHash() {
  var out = {};
  var h = location.hash.replace(/^#/, "");
  if (!h) { return out; }
  var parti = h.split("&");
  var i, kv, k;
  for (i = 0; i < parti.length; i++) {
    kv = parti[i].split("=");
    k = kv.shift();
    out[k] = decodeURIComponent(kv.join("="));
  }
  return out;
}
var H = leggiHash();
var CFG = {
  server: H.s || "",
  user:   H.u || "",
  pass:   H.p || "",
  proxy:  H.x || "",
  video:  H.v || "",
  timeout: 10000
};
// ========================================

var logEl = document.getElementById("log");

function add(cls, text) {
  var d = document.createElement("div");
  d.className = "row " + cls;
  d.appendChild(document.createTextNode(text));
  logEl.appendChild(d);
  return d;
}

function xhrGet(url, cb) {
  var done = false;
  var x;
  try { x = new XMLHttpRequest(); } catch (e) { cb({ ok:false, msg:"XMLHttpRequest non disponibile" }); return; }
  var t = setTimeout(function () {
    if (done) { return; }
    done = true;
    try { x.abort(); } catch (e2) {}
    cb({ ok:false, msg:"timeout dopo " + (CFG.timeout / 1000) + "s" });
  }, CFG.timeout);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || done) { return; }
    done = true;
    clearTimeout(t);
    if (x.status === 0) {
      cb({ ok:false, msg:"status 0 (bloccato: CORS, mixed content, porta o rete)" });
    } else {
      cb({ ok:(x.status >= 200 && x.status < 300), status:x.status, text:x.responseText });
    }
  };
  try {
    x.open("GET", url, true);
    x.send(null);
  } catch (e3) {
    if (done) { return; }
    done = true;
    clearTimeout(t);
    cb({ ok:false, msg:"eccezione: " + e3.message });
  }
}

function describeApi(res) {
  if (!res.ok) {
    if (res.status) { return "HTTP " + res.status; }
    return res.msg;
  }
  var j;
  try { j = JSON.parse(res.text); } catch (e) { return "HTTP " + res.status + " ma risposta non JSON (" + res.text.length + " byte)"; }
  if (j && j.user_info) {
    var auth = (String(j.user_info.auth) === "1") ? "auth=1 (login OK)" : "auth=" + j.user_info.auth + " (login RIFIUTATO)";
    return "HTTP " + res.status + ", JSON valido, " + auth;
  }
  if (j && j.error) { return "HTTP " + res.status + ", errore proxy: " + j.error; }
  return "HTTP " + res.status + ", JSON senza user_info";
}

function testDirect(next) {
  if (!CFG.server || !CFG.user) {
    add("ko", "[A] saltato: mancano s, u, p nell'indirizzo dopo il #");
    next();
    return;
  }
  var url = CFG.server + "/player_api.php?username=" + encodeURIComponent(CFG.user) + "&password=" + encodeURIComponent(CFG.pass);
  var line = add("wait", "[A] API DIRETTE dal browser TV ... ");
  xhrGet(url, function (res) {
    line.className = "row " + (res.ok ? "ok" : "ko");
    line.firstChild.nodeValue = "[A] API DIRETTE: " + describeApi(res);
    next();
  });
}

function testProxy(next) {
  if (!CFG.proxy) {
    add("info", "[B] saltato: nessun proxy indicato (parametro x)");
    next();
    return;
  }
  var p = "player_api.php?username=" + encodeURIComponent(CFG.user) + "&password=" + encodeURIComponent(CFG.pass);
  var url = CFG.proxy + "?p=" + encodeURIComponent(p);
  var line = add("wait", "[B] API VIA PROXY ASP ... ");
  xhrGet(url, function (res) {
    line.className = "row " + (res.ok ? "ok" : "ko");
    line.firstChild.nodeValue = "[B] API VIA PROXY: " + describeApi(res);
    next();
  });
}

function testVideo(next) {
  if (!CFG.video) {
    add("info", "[C] saltato: nessun video indicato (parametro v)");
    next();
    return;
  }
  var v = document.getElementById("v");
  var line = add("wait", "[C] VIDEO diretto ... ");
  var finished = false;
  function end(ok, msg) {
    if (finished) { return; }
    finished = true;
    line.className = "row " + (ok ? "ok" : "ko");
    line.firstChild.nodeValue = "[C] VIDEO: " + msg;
    next();
  }
  v.onplaying = function () { end(true, "riproduzione partita"); };
  v.onerror = function () {
    var c = v.error ? v.error.code : "?";
    end(false, "errore player, codice " + c + " (1=abort 2=rete 3=decodifica 4=formato/sorgente non supportati)");
  };
  setTimeout(function () { end(false, "nessuna riproduzione dopo 15s"); }, 15000);
  v.src = CFG.video;
  try { v.load(); v.play(); } catch (e) {}
}

function showEnv() {
  add("info", "Pagina caricata da: " + location.protocol + "//" + location.host);
  add("info", "UA: " + navigator.userAgent);
  var hls = "";
  try { hls = document.createElement("video").canPlayType("application/vnd.apple.mpegurl"); } catch (e) {}
  add("info", "HLS nativo: " + (hls ? hls : "no") +
              " | MediaSource: " + (typeof window.MediaSource !== "undefined" ? "si" : "no"));
}

function run() {
  logEl.innerHTML = "";
  showEnv();
  testDirect(function () {
    testProxy(function () {
      testVideo(function () {
        add("info", "Fine test.");
      });
    });
  });
}

document.onkeydown = function (e) {
  var k = e.keyCode || e.which;
  if (k === 13) { run(); }
};

run();
</script>
</body>
</html>
