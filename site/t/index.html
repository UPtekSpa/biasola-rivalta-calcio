<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<meta name="robots" content="noindex,nofollow">
<title>Test TV</title>
<!--
  PAGINA TEMPORANEA: scorciatoia per il test VIDAA in ../zx-test-8f3k/test.html.
  Va rimossa insieme alla cartella zx-test-8f3k a fine prova.
  Nessun dato è scritto qui: i valori inseriti restano solo nel localStorage della TV.
-->
<style>
  html, body { margin:0; padding:0; background:#111; color:#fff; font-family: Arial, sans-serif; }
  body { padding:30px 60px; font-size:32px; }
  h1 { font-size:44px; margin:0 0 20px 0; }
  .campo { margin:0 0 14px 0; }
  label { display:block; font-size:26px; color:#bbb; margin-bottom:4px; }
  input { width:1500px; font-size:36px; padding:10px 14px; background:#222; color:#fff;
          border:4px solid #444; outline:none; }
  input:focus, button:focus { border-color:#ffd166; background:#333; }
  button { font-size:36px; padding:14px 40px; margin:16px 20px 0 0; background:#2a5db0; color:#fff;
           border:4px solid #2a5db0; outline:none; }
  button.sec { background:#444; border-color:#444; }
  .hint { color:#aaa; font-size:24px; margin-top:20px; }
  #msg { color:#ffd166; font-size:30px; margin:10px 0; }
  .nascosto { display:none; }
</style>
</head>
<body>

<div id="pronto" class="nascosto">
  <h1>Test TV - dati salvati</h1>
  <div id="riepilogo"></div>
  <div id="msg"></div>
  <button id="bAvvia" class="nav">Avvia test</button>
  <button id="bModifica" class="nav sec">Modifica dati</button>
  <button id="bCancella" class="nav sec">Cancella dati</button>
</div>

<div id="modulo" class="nascosto">
  <h1>Test TV - inserisci i dati</h1>
  <div class="campo"><label for="s">Server Xtream (es. http://server:8080)</label><input id="s" class="nav" type="text" value="http://"></div>
  <div class="campo"><label for="u">Utente</label><input id="u" class="nav" type="text"></div>
  <div class="campo"><label for="p">Password</label><input id="p" class="nav" type="text"></div>
  <div class="campo"><label for="v">URL stream di prova (facoltativo)</label><input id="v" class="nav" type="text"></div>
  <div class="campo"><label for="x">URL proxy ASP (facoltativo)</label><input id="x" class="nav" type="text"></div>
  <button id="bSalva" class="nav">Salva e avvia</button>
  <div class="hint">Frecce su/giu per spostarti, OK per scrivere o passare al campo dopo. I dati restano solo su questa TV.</div>
</div>

<script>
var CHIAVE = "testTvDati";
var CAMPI = ["s", "u", "p", "v", "x"];
var DEST = "../zx-test-8f3k/test.html";
var timer = null;

function $(id) { return document.getElementById(id); }

function carica() {
  var t = null;
  try { t = window.localStorage.getItem(CHIAVE); } catch (e) {}
  if (!t) { return null; }
  try { return JSON.parse(t); } catch (e2) { return null; }
}

function salva(d) {
  try { window.localStorage.setItem(CHIAVE, JSON.stringify(d)); } catch (e) {}
}

function cancella() {
  try { window.localStorage.removeItem(CHIAVE); } catch (e) {}
}

function pulisciServer(s) {
  s = s.replace(/^\s+|\s+$/g, "");
  if (s === "http://" || s === "https://") { return ""; }
  if (s && !/^https?:\/\//i.test(s)) { s = "http://" + s; }
  return s.replace(/\/+$/, "");
}

function avvia(d) {
  var parti = [];
  var i, k;
  for (i = 0; i < CAMPI.length; i++) {
    k = CAMPI[i];
    if (d[k]) { parti.push(k + "=" + encodeURIComponent(d[k])); }
  }
  location.href = DEST + "#" + parti.join("&");
}

function fermaTimer() {
  if (timer) { clearInterval(timer); timer = null; }
  $("msg").innerHTML = "";
}

// Navigazione col telecomando: su/giu (e sinistra/destra sui pulsanti) tra gli elementi .nav
function elementiVisibili() {
  var tutti = document.getElementsByClassName ? document.getElementsByClassName("nav") : document.querySelectorAll(".nav");
  var out = [];
  var i, el, p, vis;
  for (i = 0; i < tutti.length; i++) {
    el = tutti[i];
    vis = true;
    p = el;
    while (p && p !== document.body) {
      if (p.className && (" " + p.className + " ").indexOf(" nascosto ") >= 0) { vis = false; break; }
      p = p.parentNode;
    }
    if (vis) { out.push(el); }
  }
  return out;
}

function sposta(delta) {
  var el = elementiVisibili();
  var i, pos = -1;
  for (i = 0; i < el.length; i++) { if (el[i] === document.activeElement) { pos = i; } }
  pos = pos + delta;
  if (pos < 0) { pos = 0; }
  if (pos >= el.length) { pos = el.length - 1; }
  if (el[pos]) { el[pos].focus(); }
}

document.onkeydown = function (ev) {
  ev = ev || window.event;
  var k = ev.keyCode;
  var a = document.activeElement;
  var inInput = a && a.tagName === "INPUT";
  fermaTimer();
  if (k === 40) { sposta(1); return false; }            // giu
  if (k === 38) { sposta(-1); return false; }           // su
  if (!inInput && k === 39) { sposta(1); return false; }  // destra sui pulsanti
  if (!inInput && k === 37) { sposta(-1); return false; } // sinistra sui pulsanti
  if (k === 13 && inInput) {                            // OK su un campo: passa al successivo
    if (a.id === "x") { $("bSalva").focus(); } else { sposta(1); }
    return false;
  }
  return true;
};

function mostraModulo() {
  var d = carica() || {};
  var i, k;
  fermaTimer();
  for (i = 0; i < CAMPI.length; i++) {
    k = CAMPI[i];
    if (d[k]) { $(k).value = d[k]; }
  }
  $("pronto").className = "nascosto";
  $("modulo").className = "";
  $("s").focus();
}

function mostraPronto(d) {
  var r = "Server: " + d.s + "<br>Utente: " + d.u +
          (d.v ? "<br>Stream: si" : "") + (d.x ? "<br>Proxy: si" : "");
  var n = 5;
  $("riepilogo").innerHTML = r.replace(/</g, "&lt;").replace(/&lt;br>/g, "<br>");
  $("modulo").className = "nascosto";
  $("pronto").className = "";
  $("bAvvia").focus();
  $("msg").innerHTML = "Avvio automatico tra " + n + " s (premi un tasto per fermarlo)";
  timer = setInterval(function () {
    n--;
    if (n <= 0) { fermaTimer(); avvia(d); return; }
    $("msg").innerHTML = "Avvio automatico tra " + n + " s (premi un tasto per fermarlo)";
  }, 1000);
}

$("bSalva").onclick = function () {
  var d = {};
  var i, k;
  for (i = 0; i < CAMPI.length; i++) {
    k = CAMPI[i];
    d[k] = $(k).value.replace(/^\s+|\s+$/g, "");
  }
  d.s = pulisciServer(d.s);
  if (!d.s || !d.u) { alertMsg("Servono almeno server e utente"); return; }
  salva(d);
  avvia(d);
};
$("bAvvia").onclick = function () { var d = carica(); if (d) { avvia(d); } else { mostraModulo(); } };
$("bModifica").onclick = mostraModulo;
$("bCancella").onclick = function () { cancella(); mostraModulo(); };

function alertMsg(t) {
  var h = document.querySelector("#modulo .hint");
  h.innerHTML = t;
  h.style.color = "#ff6b6b";
}

(function () {
  var d = carica();
  if (d && d.s && location.search.indexOf("e") < 0) { mostraPronto(d); } else { mostraModulo(); }
})();
</script>
</body>
</html>
